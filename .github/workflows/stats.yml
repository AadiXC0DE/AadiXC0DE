name: Refresh profile stats

on:
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/scripts/generate-stats.mjs'
      - '.github/workflows/stats.yml'

permissions:
  contents: write

concurrency:
  group: profile-stats
  cancel-in-progress: true

jobs:
  stats:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Generate cards
        env:
          # A classic PAT in STATS_TOKEN picks up private-repo contributions.
          # Without it the default token still renders every public number.
          GITHUB_TOKEN: ${{ secrets.STATS_TOKEN || github.token }}
          STATS_USER: ${{ github.repository_owner }}
        run: node .github/scripts/generate-stats.mjs

      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets
          git diff --quiet --cached || git commit -m "chore: refresh profile stats"
          git push
